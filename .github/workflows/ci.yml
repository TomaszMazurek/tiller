name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The cockpit crate needs webkit system libs (Linux) and is checked
      # separately in rust-app-check; core crates must stay dependency-free.
      # tiller-term: unit tests on every OS; the ConPTY integration suite is
      # cfg(windows), so it only engages on the Windows leg; the kill-
      # escalation suite (tests/unix_kill.rs) is cfg(unix) and engages on the
      # Linux/macOS legs.
      # tiller-git vendors libgit2, whose build needs cmake (preinstalled on
      # windows/macos runners; explicit on Linux for robustness).
      - name: Install cmake (tiller-git vendored libgit2)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --exclude cockpit -- -D warnings
      - run: cargo test -p tiller-core -p tiller-rpc -p tiller-term -p tiller-git

  rust-app-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Linux needs the webkit system libs via apt; Windows runners ship
      # WebView2, so no extra setup is required there. pkg-config and
      # libdbus-1-dev: libdbus-sys (transitive via tauri/muda) probes
      # dbus-1 through pkg-config and needs the headers even for a check.
      # cmake: tiller-git vendors libgit2 (workspace builds reach it even
      # when only cockpit packages are requested, via lockfile-wide metadata
      # and future workspace builds).
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake
      # Windows: full cockpit suite (unit + the cfg(windows) ConPTY
      # integration tests). Ubuntu: check + unit tests only — the ConPTY
      # suite is cfg(windows) and unix PTY coverage for the session host is
      # not part of this slice, so a full test run there adds nothing over
      # compile checking the tauri glue.
      - run: cargo check -p cockpit
      - run: cargo test -p cockpit --lib
      - if: runner.os == 'Windows'
        run: cargo test -p cockpit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
