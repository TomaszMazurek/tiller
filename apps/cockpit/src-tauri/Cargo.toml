[package]
name = "cockpit"
description = "Tiller cockpit: Tauri 2 shell bridging the UI to the core over JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tiller-rpc.workspace = true
tiller-term.workspace = true
tiller-git.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
git2.workspace = true
