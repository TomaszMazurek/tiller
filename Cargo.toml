[workspace]
resolver = "2"
members = ["crates/*", "apps/cockpit/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tiller-core = { path = "crates/core", version = "0.1.0" }
tiller-rpc = { path = "crates/rpc", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
